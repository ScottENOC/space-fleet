<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Frontier Command</title><link rel="stylesheet" href="style.css?v=50"><link rel="stylesheet" href="frontier.css?v=50"><link rel="stylesheet" href="game-hud.css?v=50"><link rel="stylesheet" href="sensor-hud.css?v=50"><link rel="stylesheet" href="flight-hud.css?v=50"><link rel="stylesheet" href="heat-hud.css?v=50"><link rel="stylesheet" href="boarding-hud.css?v=50"><script type="importmap">{"imports":{"./sim.js":"./sim.js?v=50","./shipyard.js":"./shipyard-oriented.js?v=50","./fleet-mode.js":"./fleet-mode.js?v=50","./hull-catalog.js":"./hull-catalog.js?v=50","./premades.js":"./premades-v2.js?v=50","./campaign-core.js":"./campaign-core.js?v=50","./battle-outcomes.js":"./battle-outcomes.js?v=50","./trading-hulks.js":"./trading-hulks.js?v=50","./frontier-rules.js":"./frontier-rules.js?v=50","./craft-catalog.js":"./craft-catalog.js?v=50"}}</script></head><body>
<header><div><h1>Frontier Command</h1></div><div class="controls"><button id="pause" hidden>Pause</button><button id="reset">Fight fleets</button><button id="batch">Run 100 battles</button><label>Sim speed <input id="speed" type="range" min="1" max="20" value="1"></label></div></header>
<nav class="tabs"><button class="tab active" data-tab="shipyard">Shipyard</button><button class="tab" data-tab="battle">Battle</button></nav>
<section id="shipyard" class="tabpane active"><div class="yardbar"><div class="slotpick"><button data-slot="A" class="active">Player design</button><button data-slot="B">Enemy design</button></div><label>Frame <select id="hull"></select></label><label>Name <input id="shipName"></label><label>Doctrine <select id="doctrine"><option value="pursuit">Bow-on pursuit</option><option value="broadside">Broadside</option></select></label><button id="presetHull">Load this frame's premade</button><button id="presetBroadside">Load Lancer frigate</button><button id="presetPursuit">Load Sparrow starter</button></div><div class="fleetSetup"><strong>Fleet deployment</strong><label>Player ships <select id="playerCount"><option>1</option><option>2</option><option>3</option></select></label><label>Enemy ships <select id="enemyCount"><option>1</option><option>2</option><option>3</option></select></label></div><div class="yardlayout"><aside class="palette"><h2>Modules</h2><div id="palette"></div><div class="orientation"><button id="rotate">Rotate ↻</button><span id="orientation">Facing ↑</span></div><button id="erase">Erase / remove</button></aside><div class="framearea"><div id="grid"></div><div id="designStats"></div></div></div></section>
<main id="battle" class="tabpane"><section class="battle"><div class="cameraBar"><div class="viewpick"><button id="focusView" class="active">Focus ship</button><button id="fleetView">Show fleet</button></div><label id="focusLabel">Track <select id="focusShip"></select></label><span id="cameraReadout"></span></div><canvas id="space"></canvas></section><aside><div class="orders"><h2>Player combat order</h2><label>Ships receiving order<select id="orderShips"></select></label><label>Enemy target<select id="orderTarget"></select></label><label>Component priority<select id="orderPriority"><option value="default">Default order</option><option value="weapons">Weapons first</option><option value="engine">Engines first</option><option value="reactor">Reactor first</option><option value="bridge">Bridge first</option><option value="shield">Shields first</option><option value="radiator">Radiators first</option><option value="armor">Armour first</option><option value="hull">Hull first</option></select></label><label>Collision order<select id="orderRam"><option value="discretion">Captain's discretion</option><option value="avoid">Avoid collisions</option><option value="ram">Ram selected target</option></select></label><button id="applyTargetOrder">Issue combat order</button></div><div id="stats"></div><div id="log"></div></aside></main>
